<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ryvenCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f7ff" stop-opacity="1" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
    <filter id="ryvenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background dark disk -->
  <circle cx="32" cy="32" r="30" fill="#070d18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

  <!-- Outer dashed ring -->
  <circle cx="32" cy="32" r="26" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 4" stroke-opacity="0.75" />

  <!-- Inner solid ring -->
  <circle cx="32" cy="32" r="20" stroke="#7dd3fc" stroke-width="1" stroke-opacity="0.6" />

  <!-- Technical tick segments -->
  <circle cx="32" cy="32" r="15" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.8" />

  <!-- Luminous Core -->
  <circle cx="32" cy="32" r="9" fill="url(#ryvenCore)" filter="url(#ryvenGlow)" />
  <circle cx="32" cy="32" r="4" fill="#f0f9ff" />
</svg>
